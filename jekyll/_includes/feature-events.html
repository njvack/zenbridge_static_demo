{% comment %} Upcoming events, from _data/events.yml {% endcomment %}
<ul class="event-list">
  {% for event in site.data.events %}
  <li class="event-list__item">
    <h3 class="event-list__title">{{ event.title }}</h3>
    <p class="event-list__when">{{ event.when }}</p>
    {% if event.details and event.details != "" %}<div class="event-list__details">{{ event.details | markdownify }}</div>{% endif %}
  </li>
  {% endfor %}
</ul>
