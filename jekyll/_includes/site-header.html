<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" width="282" height="139"
           alt="Zen Bridge Stillwater Meditation Center, home">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-list" hidden>
      <span class="nav-toggle__icon" aria-hidden="true"></span>
      Menu
    </button>
  </div>

  <nav class="site-nav" aria-label="Main">
    <ul class="site-nav__list" id="site-nav-list">
      {% for item in site.data.navigation %}
        {% if item.children %}
          {% assign child_urls = item.children | map: "url" %}
          <li class="site-nav__item site-nav__item--has-children">
            <button class="site-nav__link site-nav__parent{% if child_urls contains page.url %} is-current{% endif %}"
                    type="button" aria-expanded="false" aria-controls="submenu-{{ forloop.index }}">
              {{ item.title }}
            </button>
            <ul class="site-nav__submenu" id="submenu-{{ forloop.index }}">
              {% for child in item.children %}
              <li>
                <a class="site-nav__sublink" href="{{ child.url | relative_url }}"
                   {% if page.url == child.url %}aria-current="page"{% endif %}>{{ child.title }}</a>
              </li>
              {% endfor %}
            </ul>
          </li>
        {% else %}
          <li class="site-nav__item">
            <a class="site-nav__link" href="{{ item.url | relative_url }}"
               {% if page.url == item.url or page.url == "/index.html" and item.url == "/" %}aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </nav>
</header>
