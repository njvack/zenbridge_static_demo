---
layout: default
---
<h2>Upcoming events</h2>

{% comment %} Events come from _data/events.yml {% endcomment %}
<ul class="event-list">
  {% for event in site.data.events %}
  <li>
    <h3>{{ event.title }}</h3>
    <p class="event-list__when">{{ event.when }}</p>
    {% if event.details %}{{ event.details | markdownify }}{% endif %}
  </li>
  {% endfor %}
</ul>

{{ content }}
