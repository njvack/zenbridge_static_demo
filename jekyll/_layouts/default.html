<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>document.documentElement.classList.add("js");</script>
  <script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  {% include site-header.html %}

  {% if page.hero %}
  <div class="hero">
    <img class="hero__image"
         src="{{ '/assets/images/hero-bridge-1200.jpg' | relative_url }}"
         srcset="{{ '/assets/images/hero-bridge-800.jpg' | relative_url }} 800w,
                 {{ '/assets/images/hero-bridge-1200.jpg' | relative_url }} 1200w,
                 {{ '/assets/images/hero-bridge-2000.jpg' | relative_url }} 2000w"
         sizes="100vw" width="2000" height="1007" alt="">
  </div>
  {% endif %}

  <main id="main" class="site-main" tabindex="-1">
    <article class="page">
      <header class="page__header">
        <h1 class="page__title">{{ page.heading | default: page.title }}</h1>
        {% if page.lead %}<p class="page__lead">{{ page.lead }}</p>{% endif %}
      </header>
      <div class="page__content prose">
        {{ content }}
      </div>
    </article>
  </main>

  {% include site-footer.html %}
</body>
</html>
