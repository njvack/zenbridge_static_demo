# Pages CMS configuration (https://pagescms.org).
# Lets volunteers edit the Jekyll site in jekyll/ through web forms.
# Each page is a list of sections; see jekyll/README.md.

settings:
  content:
    merge: true   # keep settings this file doesn't list (layout, permalink…)
  commit:
    templates:
      update: "Update {filename} (via Pages CMS, {userName})"

media:
  input: jekyll/assets/images
  output: assets/images
  categories: [image]
  rename: safe

components:
  section:
    label: Sections
    description: The page is built from these blocks, top to bottom. Drag to reorder.
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{heading}"
    fields:
      - name: heading
        label: Heading
        type: string
        description: Optional. Shown as a section heading.
      - name: text
        label: Text
        type: rich-text
        options:
          switcher: false
          media: false
      - name: image
        label: Photo
        type: object
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Description for screen readers
            type: string
            description: Say what the photo shows, in a short sentence. Leave empty only for purely decorative images.
          - name: caption
            label: Caption
            type: string
            description: Optional. Shown under the photo.
          - name: position
            label: Where the photo goes
            type: select
            options:
              values:
                - { name: right, label: Beside the text, on the right }
                - { name: left, label: Beside the text, on the left }
                - { name: above, label: Above the text }
                - { name: below, label: Below the text }
      - name: feature
        label: Built-in content
        type: select
        description: Adds content that is kept up to date elsewhere (events, board members, contact details).
        options:
          placeholder: None
          values:
            - { name: events, label: Upcoming events list }
            - { name: board, label: Board members list }
            - { name: donate, label: Donate button and QR code }
            - { name: visit, label: Addresses and map link }
      - name: style
        label: Style
        type: select
        options:
          placeholder: Normal
          values:
            - { name: plain, label: Normal }
            - { name: centered, label: Centered }
            - { name: highlight, label: Highlighted (purple box) }

content:
  - name: pages
    label: Pages
    type: group
    items:
      - { name: home, label: Home, type: file, path: jekyll/index.md, fields: [ { name: title, label: Page name (browser tab), type: string, required: true }, { name: heading, label: Page heading, type: string }, { name: lead, label: Introduction, type: text }, { name: sections, component: section } ] }
      - { name: mission-values, label: Mission & Values, type: file, path: jekyll/mission--values.md, fields: [ { name: title, label: Page name (menu and browser tab), type: string, required: true }, { name: heading, label: Page heading, type: string }, { name: lead, label: Introduction, type: text }, { name: sections, component: section } ] }
      - { name: history, label: History, type: file, path: jekyll/history.md, fields: [ { name: title, label: Page name (menu and browser tab), type: string, required: true }, { name: heading, label: Page heading, type: string }, { name: lead, label: Introduction, type: text }, { name: sections, component: section } ] }
      - { name: board-page, label: Board of Directors, description: "Members are edited under Board members.", type: file, path: jekyll/board-of-directors.md, fields: [ { name: title, label: Page name (menu and browser tab), type: string, required: true }, { name: heading, label: Page heading, type: string }, { name: lead, label: Introduction, type: text }, { name: sections, component: section } ] }
      - { name: teachers, label: Teachers, type: file, path: jekyll/teachers.md, fields: [ { name: title, label: Page name (menu and browser tab), type: string, required: true }, { name: heading, label: Page heading, type: string }, { name: lead, label: Introduction, type: text }, { name: sections, component: section } ] }
      - { name: activities, label: Activities, description: "Events are edited under Upcoming events.", type: file, path: jekyll/activities.md, fields: [ { name: title, label: Page name (menu and browser tab), type: string, required: true }, { name: heading, label: Page heading, type: string }, { name: lead, label: Introduction, type: text }, { name: sections, component: section } ] }
      - { name: giving, label: Giving, type: file, path: jekyll/giving.md, fields: [ { name: title, label: Page name (menu and browser tab), type: string, required: true }, { name: heading, label: Page heading, type: string }, { name: lead, label: Introduction, type: text }, { name: sections, component: section } ] }
      - { name: contact, label: Contact Us, description: "Addresses come from Site settings.", type: file, path: jekyll/contact-us.md, fields: [ { name: title, label: Page name (menu and browser tab), type: string, required: true }, { name: heading, label: Page heading, type: string }, { name: lead, label: Introduction, type: text }, { name: sections, component: section } ] }

  - name: events
    label: Upcoming events
    description: Shown wherever a section uses "Upcoming events list" (the Activities page). Remove events once they have passed.
    type: file
    path: jekyll/_data/events.yml
    list: true
    fields:
      - { name: title, label: Event, type: string, required: true }
      - { name: when, label: When, type: string, required: true, description: "Written the way you want it to read, e.g. Dec 11–12" }
      - { name: details, label: Details, type: rich-text, options: { switcher: false, media: false } }

  - name: board
    label: Board members
    description: Shown on the Board of Directors page, in this order.
    type: file
    path: jekyll/_data/board.yml
    list: true
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Role, type: string, required: true }

  - name: navigation
    label: Menu
    description: The main menu. An item with sub-items becomes a drop-down and needs no link of its own.
    type: file
    path: jekyll/_data/navigation.yml
    list: true
    fields:
      - { name: title, label: Label, type: string, required: true }
      - { name: url, label: Link, type: string, description: "The page address, e.g. /giving.html" }
      - name: children
        label: Sub-items
        type: object
        list: true
        fields:
          - { name: title, label: Label, type: string, required: true }
          - { name: url, label: Link, type: string, required: true }

  - name: settings
    label: Site settings
    description: Contact details used across the site.
    type: file
    path: jekyll/_data/contact.yml
    fields:
      - { name: email, label: Contact email, type: string, required: true }
      - { name: zoom_url, label: Zoom link, type: string }
      - { name: donate_url, label: PayPal donate link, type: string }
      - { name: mailing_address, label: Mailing address (one line per entry), type: string, list: true }
      - name: meeting_place
        label: Where we meet
        type: object
        fields:
          - { name: name, label: Place name, type: string }
          - { name: street, label: Street, type: string }
          - { name: city, label: City, state and ZIP, type: string }
          - { name: map_url, label: Google Maps link, type: string }
      - { name: ein, label: EIN, type: string }
